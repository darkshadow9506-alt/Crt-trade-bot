# ======================================================================
# CRT Trade Bot - configuration
# Copy this file to config/config.yaml and edit it.
# ======================================================================

# --- Instrument / data -------------------------------------------------
symbol: "BTCUSD"
# Lowest-timeframe base data the backtester drives on (the engine resamples
# everything else from this). Use the smallest TF in your chosen tf_set.
base_timeframe: "1min"

# --- Which multi-timeframe set to trade --------------------------------
# One of: "1D-1H-15min", "4H-15min-5min", "1H-5min-1min"
# htf = context / CRT range, mtf = CHoCH + 0.61-0.78 pullback, ltf = entry
tf_set: "4H-15min-5min"

tf_sets:
  "1D-1H-15min":   { htf: "1D",  mtf: "1H",    ltf: "15min" }
  "4H-15min-5min": { htf: "4H",  mtf: "15min", ltf: "5min"  }
  "1H-5min-1min":  { htf: "1H",  mtf: "5min",  ltf: "1min"  }

# --- Trading sessions (hunt setups inside ANY of these windows) --------
# Each session is checked in its own timezone. A setup is allowed if price is
# inside any one of them. Comment out the ones you don't want.
session:
  enabled: true
  sessions:
    - { name: "asia",     timezone: "Asia/Tokyo",       start: "09:00", end: "15:00" }
    - { name: "london",   timezone: "Europe/London",    start: "07:00", end: "16:00" }
    - { name: "new_york", timezone: "America/New_York", start: "08:00", end: "17:00" }

# --- Strategy parameters ----------------------------------------------
strategy:
  # HTF point-of-interest that must be tagged before we accept a CRT.
  # Any of these reached => POI condition satisfied.
  poi:
    use_fvg: true
    use_order_block: true
    use_liquidity_sweep: true        # sweep of previous session high/low
    lookback_sessions: 3             # how many prior sessions' highs/lows count as liquidity

  # CRT (Candlestick Range Theory) manipulation candle:
  #   bullish: wick takes previous candle low, body closes back above it
  #   bearish: wick takes previous candle high, body closes back below it
  crt:
    require_close_inside: true       # close must return inside the range candle
    min_wick_sweep_atr: 0.05         # min sweep depth beyond prev candle (in ATR units), filters noise

  # Market-structure shift confirmation on MTF and LTF.
  structure:
    swing_lookback: 2                # fractal strength (bars each side) for swing points

  # Pullback retracement zone on MTF (your 0.61 - 0.78 OTE-deep zone).
  fib:
    pullback_min: 0.618
    pullback_max: 0.786
    # Target / take-profit logic:
    #   trend_aligned target  = CRT extreme (full range high/low)
    #   counter_trend target  = equilibrium (0.5 of CRT range)
    equilibrium_level: 0.5
    # If, before entry triggers, price already reached the equilibrium target
    # in a counter-trend setup => skip the trade entirely.
    skip_if_eq_already_touched: true

  # LTF entry refinement: enter on inversion FVG (iFVG) or change in
  # state of delivery (CISD) after the LTF CHoCH.
  entry:
    use_ifvg: true
    use_cisd: true
    # Stop loss is placed beyond the pullback extreme (the candle that first
    # tagged the fib zone), padded by this many ATR.
    sl_padding_atr: 0.1
    # Minimum reward:risk to accept a trade.
    min_rr: 1.5

# --- Risk management / prop-firm rules ---------------------------------
risk:
  account_balance: 100000.0          # starting balance (prop account size)
  risk_per_trade_pct: 0.5            # % of balance risked per trade
  max_open_trades: 1
  # Prop-firm guardrails (bot stops trading when hit):
  max_daily_loss_pct: 4.0            # FTMO-style daily loss limit
  max_total_drawdown_pct: 8.0        # overall max drawdown
  profit_target_pct: 8.0             # phase profit target (info / stop-when-reached)
  stop_trading_on_target: false

# --- Costs (for realistic backtests) ----------------------------------
costs:
  spread_points: 0.0                 # in price units
  commission_per_trade: 0.0          # round-turn, account currency
  slippage_points: 0.0

# --- Backtest ----------------------------------------------------------
backtest:
  data_csv: "examples/sample_BTCUSD_1min.csv"
  start: null                        # e.g. "2026-01-01" or null for all
  end: null
  report_dir: "reports"

# --- Live signal generation -------------------------------------------
live:
  # feed options:
  #   binance -> crypto, no API key (best data, but geo-blocked in sanctioned regions)
  #   toobit  -> crypto, no API key (Binance-compatible; use if Binance is blocked)
  #   mt5     -> forex / metals / indices for prop firms (needs MT5 terminal)
  #   csv     -> offline replay of a CSV (for testing)
  feed: "csv"

  # For Toobit only: which market to read.
  #   "spot"    -> symbols like BTCUSDT
  #   "futures" -> USDT-M perpetuals; metals/indices/stocks (XAUUSDT, NAS100USDT,
  #                SPX500USDT, TSLAUSDT, ...) live HERE. Just use the app symbol
  #                (e.g. XAUUSDT); the bot converts it to XAU-SWAP-USDT for you.
  market: "spot"

  # Scan MANY symbols at once. Use EXACT feed symbols. Symbols the feed doesn't
  # list are auto-skipped with a one-time warning. Crypto majors live on
  # Binance/Toobit; metals/indices/stocks live on Toobit USDT-M futures (set
  # feed: "toobit" + market: "futures") or on MT5 -- NOT on Binance spot.
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    # --- more crypto (uncomment what your feed supports) ---
    # - "BNBUSDT"
    # - "XRPUSDT"
    # - "DOGEUSDT"
    # - "AVAXUSDT"
    # - "LINKUSDT"
    # - "LTCUSDT"
    # --- Toobit USDT-M metals / indices / stocks (need market: "futures") ---
    # - "XAUUSDT"        # gold
    # - "XAGUSDT"        # silver
    # - "NAS100USDT"     # Nasdaq 100
    # - "SPX500USDT"     # S&P 500
    # - "GER40USDT"      # DAX 40
    # - "OILWTIUSDT"     # WTI crude
    # - "TSLAUSDT"       # Tesla
    # - "MSTRUSDT"       # MicroStrategy
  symbol: "BTCUSDT"                  # fallback if 'symbols' is empty / single-symbol mode

  # Which timeframe sets to run PER symbol: "all" (all three) or a list of names.
  tf_sets: "all"                     # or e.g. ["1H-5min-1min", "4H-15min-5min"]

  poll_seconds: 60                   # how often to poll (raise it when scanning many symbols)
  request_throttle: 0.2              # seconds between API calls; spaces out a big scan to avoid rate limits
  # transient network errors (VPN blips, timeouts, 429) are retried automatically
  htf_limit: 300                     # candles fetched per timeframe
  mtf_limit: 600
  ltf_limit: 600
  send_trade_updates: true           # also message when a signal hits TP/SL
  state_dir: "reports"               # per-symbol/per-set state files (dedup + restart safety)

  # csv replay feed:
  csv_path: "examples/sample_BTCUSD_1min.csv"
  csv_start_index: 0

  # crypto feeds (no key needed) -- override host only if you need to:
  # binance_base_url: "https://api.binance.com"
  # toobit_base_url:  "https://api.toobit.com"

  # mt5 feed (Windows/VPS, terminal running):
  # mt5_login: 12345678
  # mt5_password: ""
  # mt5_server: ""

# --- Notifications (live signals) -------------------------------------
notify:
  telegram:
    enabled: false
    bot_token: ""                    # from @BotFather
    chat_id: ""                      # your chat / channel id
